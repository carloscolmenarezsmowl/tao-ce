name: tao-ce

services:
  tao:
    configs:
      - source: tao_config
        target: /etc/tao-ce/config/tao.yaml
        mode: 0644
      - source: caddyfile
        target: /etc/tao-ce/config/Caddyfile
        mode: 0644
      - source: environments
        target: /usr/local/libexec/tao-ce/setup/apps/files/environments.libsonnet
        mode: 0644
      - source: sidecar_config
        target: /opt/tao-ce/environment-management/sidecar/config.yaml
        mode: 0644
    image: quay.io/tao-ce/tao-ce:${TAO_CE_VERSION:-latest}
    extra_hosts:
    - ${TAO_CE_PUBLIC_DOMAIN:-community.tao.internal}:0.0.0.0
    ports:
      - 8443:443
    cgroup: host
    volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - tao-ce-lib:/var/lib/tao-ce:rw
    privileged: true
    depends_on:
      es:
        condition: service_healthy

    links:
    - redis:redis
    - pgsql:pgsql
    - es:es
    - pubsub:pubsub
    - firestore:firestore


configs:
  caddyfile:
    file: ./Caddyfile.local
  environments:
    file: ./environments.libsonnet.local
  sidecar_config:
    file: ./sidecar-config.yaml.local
  tao_config:
    content: |
      spec:
        publicDomain: ${TAO_CE_PUBLIC_DOMAIN:-community.tao.internal}
        defaultLocale: ${TAO_CE_DEFAULT_LOCALE:-en-US}
        dependencies:
        - key: pubsub
          type: pubsub
          address:
            schema: http
            port: 8432
            host: pubsub
        - key: firestore
          type: firestore
          address:
            schema: http
            port: 8080
            host: firestore
        - key: es
          type: es
          address:
            schema: http
            port: 9200
            host: es
        - key: pgsql
          type: pgsql
          address:
            schema: pgsql
            port: 5432
            host: pgsql
        - key: redis
          type: redis
          address:
            schema: redis
            host: redis
                  

include:
- ./docker-compose.stack.yml

volumes:
  tao-ce-opt: {}
  tao-ce-lib: {}
  containers: {}
